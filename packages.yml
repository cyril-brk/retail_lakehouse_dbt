# Third-party dbt packages. Install with:  dbt deps
# Docs: https://hub.getdbt.com
packages:
  # Utility macros: surrogate keys, date spines, generic tests, etc.
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]

  # Ready-made generic tests (e.g. accepted range, not null where, etc.)
  - package: metaplane/dbt_expectations
    version: [">=0.10.10", "<0.11.0"]
