version: 2

models:
  - name: fct_inventory_events
    description: >
      Incremental (merge) fact of stock movements. Only new events since the
      last run are processed. Grain = event_id.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              values: ['receive', 'sale', 'return', 'adjustment', 'shrinkage']

  - name: agg_current_stock
    description: Current stock-on-hand per store + product.
    columns:
      - name: store_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
