version: 2

models:
  - name: dim_customers
    description: '{{ doc("dim_customers") }}'   # doc block from _core__docs.md
    columns:
      - name: customer_sk
        description: Surrogate key (hashed).
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [unique, not_null]
      - name: lifetime_value
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: dim_products
    description: Product dimension with price band and category target.
    columns:
      - name: product_sk
        data_tests: [unique, not_null]
      - name: price_band
        data_tests:
          - accepted_values:
              arguments:
                values: ['budget', 'mid', 'premium']

  - name: dim_stores
    description: Store dimension enriched with country attributes.
    columns:
      - name: store_sk
        data_tests: [unique, not_null]

  - name: fct_orders
    description: One row per order. Grain = order_id.
    # Model-level (table) test from the dbt_expectations package.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
    columns:
      - name: order_sk
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: store_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_id
      - name: order_amount
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_order_items
    description: One row per order line. Grain = order_item_id.
    columns:
      - name: order_item_sk
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
