version: 2

# =============================================================================
# Properties for the staging layer: descriptions (-> UC comments) + generic
# TESTS. Generic tests run with `dbt test`. Notice relationships tests wiring
# the models together, and accepted_values guarding enums.
# =============================================================================
models:
  - name: stg_customers
    description: Cleaned, 1:1 customer records. One row per customer.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: email
        description: Lower-cased email; null if the source was blank.
        # Not not_null on purpose — the raw data has a few missing emails.
      - name: country_code
        data_tests:
          - relationships:
              arguments:
                to: ref('country_codes')
                field: country_code

  - name: stg_products
    description: Cleaned product catalog with current price.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: price
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: stg_stores
    columns:
      - name: store_id
        data_tests: [unique, not_null]
      - name: store_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['flagship', 'standard', 'outlet']

  - name: stg_orders
    description: Cleaned order headers.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned', 'cancelled']

  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'debit_card', 'paypal', 'gift_card', 'apple_pay']

  - name: stg_inventory_events
    description: Cleaned append-only stock movements.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['receive', 'sale', 'return', 'adjustment', 'shrinkage']
